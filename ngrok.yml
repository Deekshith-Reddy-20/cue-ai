# CueAI — ngrok agent config (no secrets here).
# Authtoken is read from the NGROK_AUTHTOKEN environment variable.
# Docs: https://ngrok.com/docs/agent/config/
version: "3"
agent:
  authtoken_from_env: true
tunnels:
  web:
    proto: http
    addr: 3000
    # Next.js + Auth.js work best when the public Host is forwarded as-is.
    schemes:
      - https
